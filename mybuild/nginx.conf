server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # A BASE_PATH build emits /<base>/assets/* URLs, while the immutable
    # files remain in the image's root assets directory.
    location ~ ^/.+/assets/(.+)$ {
        try_files /assets/$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
