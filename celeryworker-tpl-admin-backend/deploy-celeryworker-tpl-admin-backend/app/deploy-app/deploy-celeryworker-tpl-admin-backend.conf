# ============================================================================
# celeryworker-tpl-admin-backend 部署配置
# 职责：部署控制参数，数据内容在 generate-*.conf 中
# ============================================================================

# TODO: 填写 PROJECT_ID 和 NAMESPACE
CELERYWORKER_TPL_ADMIN_BACKEND_PROJECT_ID="${CELERYWORKER_TPL_ADMIN_BACKEND_PROJECT_ID:-sunmoonai}"
CELERYWORKER_TPL_ADMIN_BACKEND_NAMESPACE="${CELERYWORKER_TPL_ADMIN_BACKEND_NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"   # production|development

# Harbor 地址不要写死为 harbor.sunmoonai.com:30443。
# 部署入口只传 kind/c1，由 k8s/utils/cluster-config-mapping.sh 统一解析。
CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE_REGISTRY="${CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE_PROJECT="${CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE="${CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE:-tpl-admin-backend}"
KIND_CELERYWORKER_TPL_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
DOCKER_SERVER="${DOCKER_SERVER:-harbor.sunmoonai.com:30443}"
KIND_DOCKER_SERVER="harbor.sunmoonai.com:30443"

# 组件开关（控制是否部署）
namespace_enabled="true"
secrets_enabled="true"
configmap_enabled="true"
middleware_enabled="false"
ingress_enabled="false"

# 部署优先级（数值越大越先部署）
namespace_priority=3000
secrets_priority=2000
configmap_priority=1900
middleware_priority=1000
ingress_priority=100
