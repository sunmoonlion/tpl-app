# ============================================================================
# celeryworker-tpl-admin-backend Celery Worker Secret YAML 生成配置
# Broker/Result 后端独立于业务数据库；业务数据库等敏感配置从 tpl-admin-backend Secret 继承。
# ============================================================================

TEMPLATE_FILE="templates/secret/celeryworker-tpl-admin-backend-secret.yaml"
OUTPUT_FILE="celeryworker-tpl-admin-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"



# RabbitMQ Broker URL。队列、vhost、用户和权限由 messaging-platform/rabbitmq 的 app definitions 统一创建。
RABBITMQ_SERVICE_HOST="${RABBITMQ_SERVICE_HOST:-rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local}"
RABBITMQ_SERVICE_PORT="${RABBITMQ_SERVICE_PORT:-5672}"
RABBITMQ_VHOST="${RABBITMQ_VHOST:-tpl-development}"
RABBITMQ_WORKER_USER="${RABBITMQ_WORKER_USER:-tpl-admin-backend-worker}"
RABBITMQ_WORKER_PASSWORD="${RABBITMQ_WORKER_PASSWORD:-tpl-admin-backend-worker-dev}"
CELERY_BROKER_URL="${CELERY_BROKER_URL:-amqp://${RABBITMQ_WORKER_USER}:${RABBITMQ_WORKER_PASSWORD}@${RABBITMQ_SERVICE_HOST}:${RABBITMQ_SERVICE_PORT}/${RABBITMQ_VHOST}}"

# 默认不启用独立结果后端。若任务需要结果持久化，可改为 backend 已使用的 Redis/DB URL。
CELERY_RESULT_BACKEND="${CELERY_RESULT_BACKEND:-}"
