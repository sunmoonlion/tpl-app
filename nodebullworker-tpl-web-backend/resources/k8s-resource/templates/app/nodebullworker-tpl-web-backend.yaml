apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebullworker-tpl-web-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: nodebullworker-tpl-web-backend
    component: node-bull-worker
    backend: tpl-web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodebullworker-tpl-web-backend
  template:
    metadata:
      labels:
        app: nodebullworker-tpl-web-backend
        component: node-bull-worker
        backend: tpl-web-backend
    spec:
      imagePullSecrets:
      - name: ${NODEBULLWORKER_TPL_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: nodebullworker
        image: ${NODEBULLWORKER_TPL_WEB_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        command:
        - sh
        - -c
        - |
          set -eu
          export NODE_ENV="__CONTAINER_NODE_ENV_DEFAULT__"
          export QUEUE_ON="__CONTAINER_QUEUE_ON_DEFAULT__"
          exec node dist/worker
        envFrom:
        - configMapRef:
            name: ${TPL_WEB_BACKEND_CONFIGMAP_NAME:-tpl-web-backend-config}
        - secretRef:
            name: ${TPL_WEB_BACKEND_SECRET_NAME:-tpl-web-backend-secret}
        - configMapRef:
            name: ${NODEBULLWORKER_TPL_WEB_BACKEND_CONFIGMAP_NAME:-nodebullworker-tpl-web-backend-config}
        - secretRef:
            name: ${NODEBULLWORKER_TPL_WEB_BACKEND_SECRET_NAME:-nodebullworker-tpl-web-backend-secret}
        - secretRef:
            name: ${NODEBULLWORKER_TPL_WEB_BACKEND_QUEUE_REDIS_SECRET_NAME:-tpl-web-backend-nodebull-redis-conn}
        env:
        - name: QUEUE_WORKER_SERVICE
          value: "tpl-web-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
